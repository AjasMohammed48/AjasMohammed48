<svg xmlns="http://www.w3.org/2000/svg" width="490" height="310" viewBox="0 0 490 310" role="img" aria-label="OceanPulse" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><rect width="490" height="310" rx="16" fill="#0F1E3D" stroke="#27457F"/><rect x="0" y="0" width="490" height="6" rx="3" fill="#B8892B"/><text x="468" y="92" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#B8892B" opacity=".10">01</text><text x="24" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">OceanPulse</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#E6C26E" letter-spacing="1.2">AI · LLM · CLIMATE DATA</text><rect x="24" y="80" width="159.6" height="22" rx="11" fill="#B8892B"><animate attributeName="opacity" values="1;.75;1" dur="2.6s" repeatCount="indefinite"/></rect><text x="103.8" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#0F1E3D" letter-spacing="1">PATENT GRANTED</text><text x="24" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E8EDF7">Physics-informed AI platform processing multi-source</text><text x="24" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E8EDF7">Indian Ocean climate data (ERA5, CMEMS) with Dask and Zarr</text><text x="24" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E8EDF7">for real-time anomaly detection and uncertainty</text><text x="24" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E8EDF7">quantification, with a domain-constrained Ollama LLM</text><text x="24" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#E8EDF7">interface for natural-language querying.</text><rect x="24.0" y="22